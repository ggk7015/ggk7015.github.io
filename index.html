    <script>
      // Pre-paint, so neither the stored theme nor the reduced-motion gate can flash.
      // Dark is the default; the OS value only applies once "自動" is picked.
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          if (stored === 'light') {
            document.documentElement.setAttribute('data-theme', 'light')
          } else if (stored !== 'system') {
            document.documentElement.setAttribute('data-theme', 'dark')
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
        var motion =
          'IntersectionObserver' in window &&
          !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)
        if (motion) {
          var root = document.documentElement
          root.classList.add('js-motion')
          // Failsafe: if the bundle never mounts, stop hiding the content.
          window.__revealFailsafe = window.setTimeout(function () {
            root.classList.remove('js-motion')
          }, 4000)
        }
      })()
    </script>
